name: Build Windows Libraries

# Packages RadarSimM for Windows from the radarsimlib GitHub release
# (https://github.com/radarsimx/radarsimlib/releases) pinned by
# .github/radarsimlib-version. A manual run can override the version.
#
# build_win.bat downloads the release and assembles the package: the contents
# of src/ plus radarsimc.dll, radarsimc.lib and radarsim.h in +RadarSim.
#
# radarsimlib publishes GPU builds only. They pick the CPU path at runtime when
# no usable CUDA device is present, so the same package serves CPU-only
# machines.
#
# Outputs:
# - Packed archive (tar.gz and zip) containing the package
#
# Triggers:
# - Tag pushes (release events)
# - Manual workflow dispatch

on:
  push:
    tags:
      - "*"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      radarsimlib_version:
        description: "radarsimlib release tag (e.g. v15.6.0). Empty uses .github/radarsimlib-version."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Package RadarSimM
        shell: cmd
        env:
          INPUT_VERSION: ${{ inputs.radarsimlib_version }}
        run: |
          if "%INPUT_VERSION%" == "" (
            .\build_win.bat
          ) else (
            .\build_win.bat --version %INPUT_VERSION%
          )

      - name: Verify package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'radarsimc.dll', 'radarsim.h') {
              $p = "radarsimm_win_x86_64_gpu\+RadarSim\$f"
              if (-not (Test-Path $p)) {
                  Write-Output "::error::$p is missing from the package"
                  exit 1
              }
          }
          Get-ChildItem 'radarsimm_win_x86_64_gpu', 'radarsimm_win_x86_64_gpu\+RadarSim'

      - name: Archive package
        uses: actions/upload-artifact@v7
        with:
          name: radarsimm_win_x86_64_gpu
          path: .\radarsimm_win_x86_64_gpu
          retention-days: 1
          compression-level: 6

  # Pack the package with a README into a single archive
  pack-artifacts:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve radarsimlib version
        env:
          INPUT_VERSION: ${{ inputs.radarsimlib_version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION//[[:space:]]/}"
          if [ -z "${version}" ]; then
              version=$(tr -d '[:space:]' < .github/radarsimlib-version)
          fi
          echo "RADARSIMLIB_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: radarsimm_win_x86_64_gpu
          path: packed/radarsimm_windows_all/Windows_x86_64_GPU

      - name: Delete downloaded artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          failOnError: false
          name: radarsimm_win_x86_64_gpu

      - name: Verify artifact structure
        run: |
          echo "::group::Artifact Structure Verification"
          find packed/radarsimm_windows_all -maxdepth 3 | sort
          echo "::endgroup::"

      - name: Create README for packed artifacts
        run: |
          cat > packed/radarsimm_windows_all/README.md << 'EOF'
          # RadarSimM Windows Build Artifacts

          This archive contains the RadarSimM package for Windows with license
          verification enabled.

          ## Directory Structure

          ```
          Windows_x86_64_GPU/
          ├── +RadarSim/
          │   ├── radarsimc.dll
          │   ├── radarsimc.lib
          │   └── radarsim.h
          ├── models/
          └── example_*.m
          ```

          ## GPU and CPU

          The library is a CUDA build. It uses an NVIDIA GPU when one is
          available and falls back to the CPU otherwise, so the same package
          serves both kinds of machine.

          ## Usage

          1. Add the `Windows_x86_64_GPU` directory to the MATLAB path
          2. Place valid `license_RadarSimM_*.lic` file(s) in the `+RadarSim` directory

          ## License Activation

          Place `license_RadarSimM_*.lic` files in the `+RadarSim` directory.
          `RadarSim.License.set_license()` searches for and activates them.

          Without a valid license, usage limits apply:
          - Maximum 1 TX channel
          - Maximum 1 RX channel
          - Maximum 2 point targets
          - Maximum 2 mesh targets
          - Maximum 8 triangles per mesh

          ## Requirements

          - x86_64 Windows
          - Microsoft Visual C++ Redistributable
          - For GPU acceleration: an NVIDIA GPU and driver supporting CUDA 13
          EOF

          {
            echo ""
            echo "Packaged from radarsimlib ${RADARSIMLIB_VERSION} at $(date -u +"%Y-%m-%d %H:%M:%S UTC")."
          } >> packed/radarsimm_windows_all/README.md

      - name: Create compressed archive
        run: |
          cd packed
          tar -czf radarsimm_windows_all_builds.tar.gz radarsimm_windows_all/
          zip -qr radarsimm_windows_all_builds.zip radarsimm_windows_all/

          echo "::group::Archive Information"
          ls -lh *.tar.gz *.zip
          echo "::endgroup::"

      - name: Upload packed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: radarsimm_windows_all_builds
          path: |
            packed/radarsimm_windows_all_builds.tar.gz
            packed/radarsimm_windows_all_builds.zip
          retention-days: 1
          compression-level: 0

      - name: Create build summary
        if: always()
        run: |
          {
            echo "# Windows RadarSimM Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| radarsimlib | \`${RADARSIMLIB_VERSION:-unknown}\` |"
            echo "| Package | \`Windows_x86_64_GPU\` |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
