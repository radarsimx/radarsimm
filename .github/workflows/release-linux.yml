name: Build Linux Libraries

# Linux counterpart of release-windows.yml: packages RadarSimM for Linux from
# the radarsimlib GitHub release (https://github.com/radarsimx/radarsimlib/releases)
# pinned by .github/radarsimlib-version. A manual run can override the version.
#
# radarsimlib publishes GPU builds only, one per Ubuntu LTS release (22.04,
# 24.04, 26.04). Every one of them in the pinned release is packaged, so a new
# Ubuntu release needs no change here. They pick the CPU path at runtime
# when no usable CUDA device is present, so the same package serves CPU-only
# machines.
#
# Each package is the contents of src/ plus the library in +RadarSim. Two
# Linux-only adjustments are made while staging, both matching what
# matlab-tests-linux.yml does so the released package is the layout the tests
# exercise:
#
#   Library   RadarSim.* call loadlibrary(fullfile(pkg_dir, 'radarsimc'), ...),
#             and MATLAB appends the platform extension, so libradarsimc.so is
#             staged as radarsimc.so. The alias stays 'radarsimc', matching
#             every calllib call.
#
#   Header    radarsim.h expands EXPORTED to
#             __attribute__((visibility("default"))) on GCC/clang, which
#             loadlibrary cannot parse. It is stripped from the copy that ships
#             with the package; it only marks the ABI for the compiler and has
#             no bearing on the prototypes loadlibrary reads.
#
# Triggers:
# - Tag pushes (release events)
# - Manual workflow dispatch

on:
  push:
    tags:
      - "*"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      radarsimlib_version:
        description: "radarsimlib release tag (e.g. v15.6.0). Empty uses .github/radarsimlib-version."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve radarsimlib version
        env:
          INPUT_VERSION: ${{ inputs.radarsimlib_version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION//[[:space:]]/}"
          if [ -z "${version}" ]; then
              version=$(tr -d '[:space:]' < .github/radarsimlib-version)
          fi
          echo "RADARSIMLIB_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Using radarsimlib ${version}"

      - name: Download radarsimlib release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p radarsimlib-release
          gh release download "${RADARSIMLIB_VERSION}" --repo radarsimx/radarsimlib \
              --pattern "radarsimlib_${RADARSIMLIB_VERSION}_Ubuntu*_x86_64_GPU.zip" \
              --dir radarsimlib-release

          echo "::group::Downloaded assets"
          ls -lh radarsimlib-release
          echo "::endgroup::"

      - name: Assemble the MATLAB packages
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=(radarsimlib-release/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
              echo '::error::No Ubuntu builds found in the radarsimlib release'
              exit 1
          fi

          root='packed/radarsimm_linux_all'
          rm -rf packed
          mkdir -p "${root}"

          for zip in "${zips[@]}"; do
              # radarsimlib_<tag>_Ubuntu24_x86_64_GPU.zip -> Ubuntu24_x86_64_GPU
              label=$(basename "${zip}" .zip)
              label="${label#radarsimlib_${RADARSIMLIB_VERSION}_}"
              echo "::group::${label}"

              unpacked="radarsimlib-release/unpacked/${label}"
              mkdir -p "${unpacked}"
              unzip -q "${zip}" -d "${unpacked}"

              lib=$(find "${unpacked}" -name 'libradarsimc.so' -type f -print -quit)
              header=$(find "${unpacked}" -name 'radarsim.h' -type f -print -quit)
              if [ -z "${lib}" ] || [ -z "${header}" ]; then
                  echo "::error::libradarsimc.so or radarsim.h missing from ${zip}"
                  exit 1
              fi

              package="${root}/${label}"
              mkdir -p "${package}"
              cp -r src/. "${package}/"

              # loadlibrary appends the platform extension to the name the
              # RadarSim package passes it, so the file has to be radarsimc.so.
              cp "${lib}" "${package}/+RadarSim/radarsimc.so"

              # Strip the visibility attribute loadlibrary cannot parse.
              sed 's/__attribute__((visibility("default")))//g' "${header}" \
                  > "${package}/+RadarSim/radarsim.h"

              if grep -q '__attribute__' "${package}/+RadarSim/radarsim.h"; then
                  echo '::error::radarsim.h still contains a GCC attribute loadlibrary cannot parse'
                  exit 1
              fi

              ls -l "${package}" "${package}/+RadarSim"
              echo "::endgroup::"
          done

      - name: Create README for packed artifacts
        run: |
          set -euo pipefail
          root='packed/radarsimm_linux_all'

          cat > "${root}/README.md" << 'EOF'
          # RadarSimM Linux Build Artifacts

          This archive contains RadarSimM packages for Linux with license
          verification enabled, one per Ubuntu LTS release.

          ## Directory Structure

          Each directory holds a complete RadarSimM package (examples, models,
          and the +RadarSim package):

          ```
          Ubuntu<version>_x86_64_GPU/
          ├── +RadarSim/
          │   ├── radarsimc.so
          │   └── radarsim.h
          ├── models/
          └── example_*.m
          ```

          The shared library is named `radarsimc.so` rather than
          `libradarsimc.so` because MATLAB's `loadlibrary` appends the platform
          extension to the name the package passes it. `radarsim.h` ships
          without the `__attribute__((visibility("default")))` markers, which
          `loadlibrary` cannot parse; they affect only how the library was
          compiled, not the exported prototypes.

          ## GPU and CPU

          The libraries are CUDA builds. They use an NVIDIA GPU when one is
          available and fall back to the CPU otherwise, so the same package
          serves both kinds of machine.

          ## Usage

          1. Choose the directory matching your Ubuntu release (or the closest
             older one for other distributions)
          2. Add the package directory to the MATLAB path
          3. Place valid `license_RadarSimM_*.lic` file(s) in the `+RadarSim` directory

          ## License Activation

          Place `license_RadarSimM_*.lic` files in the `+RadarSim` directory.
          `RadarSim.License.set_license()` searches for and activates them.

          Without a valid license, usage limits apply:
          - Maximum 1 TX channel
          - Maximum 1 RX channel
          - Maximum 2 point targets
          - Maximum 2 mesh targets
          - Maximum 8 triangles per mesh

          ## Requirements

          - x86_64 Linux with a glibc and libstdc++ at least as new as the
            matching Ubuntu release
          - For GPU acceleration: an NVIDIA GPU and driver supporting CUDA 13
          - **MATLAB**: MATLAB bundles its own libstdc++, which is often older than
            the one these libraries were built against. If `loadlibrary` reports a
            missing `GLIBCXX_*` symbol, start MATLAB with the system library
            preloaded:
            `LD_PRELOAD=$(gcc -print-file-name=libstdc++.so.6) matlab`
          EOF

          # Appended outside the heredoc so the values are expanded rather than
          # written literally.
          {
            echo ""
            echo "Packaged from radarsimlib ${RADARSIMLIB_VERSION} at $(date -u +"%Y-%m-%d %H:%M:%S UTC")."
          } >> "${root}/README.md"

      - name: Create compressed archive
        run: |
          cd packed
          tar -czf radarsimm_linux_all_builds.tar.gz radarsimm_linux_all/
          zip -qr radarsimm_linux_all_builds.zip radarsimm_linux_all/

          echo "::group::Archive Information"
          ls -lh *.tar.gz *.zip
          echo "::endgroup::"

      - name: Upload packed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: radarsimm_linux_all_builds
          path: |
            packed/radarsimm_linux_all_builds.tar.gz
            packed/radarsimm_linux_all_builds.zip
          retention-days: 1
          compression-level: 0

      - name: Create build summary
        if: always()
        run: |
          {
            echo "# Linux RadarSimM Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| radarsimlib | \`${RADARSIMLIB_VERSION:-unknown}\` |"
            echo "| Status | ${{ job.status }} |"
            echo ""
            if [ -d packed/radarsimm_linux_all ]; then
              echo "### Packages"
              for d in packed/radarsimm_linux_all/*/; do
                echo "- \`$(basename "$d")\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
