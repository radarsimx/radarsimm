name: MATLAB Tests (Windows)

# GitHub Actions workflow that runs the RadarSimM test suite with the official
# MATLAB actions (https://github.com/matlab-actions).
#
# Everything here runs on Windows, where radarsim.h exports through
# __declspec(dllexport) and MATLAB's loadlibrary reads the header as shipped.
# The Linux expansion, __attribute__((visibility("default"))), makes
# loadlibrary fail to generate its thunk file, so the same two tiers run on
# ubuntu-latest from matlab-tests-linux.yml, which strips that attribute from
# the header it stages.
#
# radarsimc comes from the radarsimlib GitHub release pinned by
# .github/radarsimlib-version. It is downloaded once and shared with the test
# jobs as an artifact. radarsimlib publishes GPU builds only; they pick the CPU
# path at runtime when no CUDA device is present, which is the case on
# GitHub-hosted runners. Both tiers run against that library:
#
#   tests/unit         Class metadata, code analyzer, and the guard clauses
#                      that run before any call into radarsimc. Runs across
#                      several MATLAB releases with the library staged in
#                      src/+RadarSim.
#   tests/integration  Drives the real simulator end to end.
#
# radarsimx/radarsimm is a public repository, so MATLAB runs on GitHub-hosted
# runners without a batch licensing token.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-radarsimc:
    name: Fetch radarsimc
    # The test jobs need the TEST_LICENSE secret, which GitHub does not expose
    # to workflows triggered by pull requests from forks. Both test jobs depend
    # on this one, so they are skipped along with it.
    if: github.event_name != 'pull_request'
    # Only downloads and unpacks the release, so a Linux runner is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download radarsimlib release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < .github/radarsimlib-version)
          asset="radarsimlib_${version}_Windows_x86_64_GPU.zip"
          echo "radarsimlib ${version}: ${asset}"

          mkdir -p radarsimlib-release
          gh release download "${version}" --repo radarsimx/radarsimlib \
              --pattern "${asset}" --dir radarsimlib-release
          unzip -q "radarsimlib-release/${asset}" -d radarsimlib-release

      - name: Collect radarsimc and its header
        run: |
          set -euo pipefail

          lib=$(find radarsimlib-release -name 'radarsimc.dll' -type f -print -quit)
          if [ -z "${lib}" ]; then
              echo '::error::radarsimc.dll not found in the radarsimlib release'
              exit 1
          fi

          header=$(find radarsimlib-release -name 'radarsim.h' -type f -print -quit)
          if [ -z "${header}" ]; then
              echo '::error::radarsim.h not found in the radarsimlib release'
              exit 1
          fi

          mkdir -p radarsimc-dist
          cp "${lib}" radarsimc-dist/radarsimc.dll
          cp "${header}" radarsimc-dist/radarsim.h

          echo '::group::Collected files'
          ls -l radarsimc-dist
          echo '::endgroup::'

      - name: Upload radarsimc
        uses: actions/upload-artifact@v7
        with:
          name: radarsimc
          path: radarsimc-dist/
          if-no-files-found: error
          retention-days: 1

  unit-tests:
    name: Unit tests (MATLAB ${{ matrix.release }})
    needs: fetch-radarsimc
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release, a recent release, and the newest one.
        release: [R2022b, R2024b, latest]
        include:
          # run-tests@v3 builds its script around
          # CodeCoveragePlugin.forFolder(..., 'MetricLevel', ...), which
          # R2022b does not accept: the run errors out before a single test
          # executes. Skip coverage there and keep the tests. The two newer
          # releases cover the same source.
          - release: R2022b
            coverage: ''
          - release: R2024b
            coverage: code-coverage/coverage.xml
          - release: latest
            coverage: code-coverage/coverage.xml

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage radarsimc into the RadarSim package
        uses: actions/download-artifact@v8
        with:
          name: radarsimc
          path: src/+RadarSim

      - name: Install the CI license
        shell: pwsh
        env:
          TEST_LICENSE: ${{ secrets.TEST_LICENSE }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TEST_LICENSE)) {
              Write-Output '::error::The TEST_LICENSE secret is empty, so the licensed build cannot be tested.'
              exit 1
          }

          $license = Join-Path (Get-Location) 'src\+RadarSim\license_RadarSimM_CI.lic'
          [System.IO.File]::WriteAllText($license, $env:TEST_LICENSE)

          Write-Output "Wrote $((Get-Item $license).Length) bytes to src\+RadarSim\license_RadarSimM_CI.lic"

      - name: Locate MinGW for loadlibrary
        shell: pwsh
        run: |
          foreach ($candidate in @('C:\mingw64', 'C:\ProgramData\mingw64\mingw64', 'C:\msys64\mingw64')) {
              if (Test-Path (Join-Path $candidate 'bin\gcc.exe')) {
                  "MW_MINGW64_LOC=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append
                  Write-Output "Using MinGW at $candidate"
                  break
              }
          }

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          cache: true

      - name: Run unit tests
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: src
          select-by-folder: tests/unit
          test-results-junit: test-results/results.xml
          code-coverage-cobertura: ${{ matrix.coverage }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.release }}
          path: |
            test-results/
            code-coverage/
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    name: Integration tests
    needs: fetch-radarsimc
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage radarsimc into the RadarSim package
        uses: actions/download-artifact@v8
        with:
          name: radarsimc
          path: src/+RadarSim

      - name: Install the CI license
        shell: pwsh
        env:
          TEST_LICENSE: ${{ secrets.TEST_LICENSE }}
        # RadarSim.License.set_license() activates every
        # license_RadarSimM_*.lic it finds in the package directory, so the
        # secret is written there under a name matching that pattern. The
        # file is covered by the *.lic entry in .gitignore.
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TEST_LICENSE)) {
              Write-Output '::error::The TEST_LICENSE secret is empty, so the licensed build cannot be tested.'
              exit 1
          }

          $license = Join-Path (Get-Location) 'src\+RadarSim\license_RadarSimM_CI.lic'
          [System.IO.File]::WriteAllText($license, $env:TEST_LICENSE)

          Write-Output "Wrote $((Get-Item $license).Length) bytes to src\+RadarSim\license_RadarSimM_CI.lic"

      - name: Locate MinGW for loadlibrary
        shell: pwsh
        # loadlibrary compiles a thunk file, so MATLAB needs a C compiler. Point
        # it at the runner's MinGW when one is present; otherwise MATLAB falls
        # back to the Visual Studio installation on the image.
        run: |
          foreach ($candidate in @('C:\mingw64', 'C:\ProgramData\mingw64\mingw64', 'C:\msys64\mingw64')) {
              if (Test-Path (Join-Path $candidate 'bin\gcc.exe')) {
                  "MW_MINGW64_LOC=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append
                  Write-Output "Using MinGW at $candidate"
                  break
              }
          }

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true

      - name: Run integration tests
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: src
          select-by-folder: tests/integration
          test-results-junit: test-results/results.xml
          code-coverage-cobertura: code-coverage/coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            test-results/
            code-coverage/
          if-no-files-found: warn
          retention-days: 14
